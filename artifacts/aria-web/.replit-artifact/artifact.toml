kind = "web"
previewPath = "/"
title = "ARIA"
version = "1.0.0"
id = "artifacts/babu-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19606

[services.development]
run = "pnpm --filter @workspace/babu-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/babu-web", "run", "build" ]
publicDir = "artifacts/babu-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19606"
BASE_PATH = "/"
